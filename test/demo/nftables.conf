#!/usr/sbin/nft -f
# Example server firewall (demo data).
# Each table resets itself before it is defined, so the file can be reloaded
# and undone cleanly. Never `flush ruleset`: Docker and Tailscale own tables too.

table inet filter
delete table inet filter

table inet filter {
    set trusted {
        type ipv4_addr
        flags interval
        elements = {
            192.168.1.20, 192.168.1.21,   # laptop, phone
            10.66.0.0/24,                 # VPN clients routed by the gateway
        }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop
        ip protocol icmp accept

        tcp dport 22 ip saddr @trusted accept comment "SSH: trusted devices"
        tcp dport 22 iifname "wg0" accept comment "SSH: VPN peers"
        tcp dport 22 iifname "tailscale0" accept comment "SSH: tailnet"

        tcp dport { 139, 445 } ip saddr @trusted accept comment "Samba"
        tcp dport { 139, 445 } iifname "tailscale0" accept comment "Samba: tailnet"

        tcp dport { 80, 443 } accept comment "nginx (public)"
        tcp dport 32400 accept comment "Plex (public)"

        iifname "wg0" ip saddr 10.20.0.2 tcp dport 2049 accept comment "NFS: backup peer only"
        udp dport 514 ip saddr 192.168.1.1 accept comment "Router syslog"
        udp dport 51820 accept comment "WireGuard"
        udp dport 41641 accept comment "Tailscale"

        limit rate 5/minute log prefix "nft-drop-in: "
    }

    chain forward {
        type filter hook forward priority filter;
    }
}

table ip ip_options_guard
delete table ip ip_options_guard
table ip ip_options_guard {
    chain pre {
        type filter hook prerouting priority -300; policy accept;
        ip hdrlength gt 5 meta l4proto tcp counter drop comment "drop TCP with IP options"
    }
}
